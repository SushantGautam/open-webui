name: Create and publish Docker images with specific build args

on:
  workflow_dispatch:
    inputs:
      webui_subpath:
        description: 'URL subpath to bake into the image (e.g. /openwebui). Leave empty to serve at root.'
        required: false
        default: ''
        type: string
      prune_only:
        description: 'Skip the build; only prune stale package versions from the registry.'
        required: false
        default: false
        type: boolean
      variants:
        description: 'Comma-separated variants to build. Default: main (what SimpleAuditStudio needs). Use "main,cuda,slim" etc. for more.'
        required: false
        default: 'main'
        type: string
  # Dispatch-only: pushes must not trigger full matrix builds. Publish
  # explicitly with `gh workflow run docker.yaml` (see FORK.md).

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_REPOSITORY: sushantgautam/open-webui

jobs:
  resolve-variants:
    runs-on: ubuntu-latest
    if: ${{ !inputs.prune_only }}
    outputs:
      variants: ${{ steps.filter.outputs.variants }}
    steps:
      - id: filter
        run: |
          ALL='["main","cuda","cuda126","ollama","slim"]'
          DEFAULT='["main"]'
          SELECTED='${{ inputs.variants }}'
          if [ -z "$SELECTED" ]; then
            echo "variants=$DEFAULT" >> "$GITHUB_OUTPUT"
          elif [ "$SELECTED" = "all" ]; then
            echo "variants=$ALL" >> "$GITHUB_OUTPUT"
          else
            # Build JSON array of only the selected variants
            IFS=',' read -ra PARTS <<< "$SELECTED"
            ARR="["
            FIRST=true
            for P in "${PARTS[@]}"; do
              V=$(echo "$P" | xargs)
              case "$V" in
                main|cuda|cuda126|ollama|slim)
                  [ "$FIRST" = true ] || ARR+=","
                  ARR+="\"$V\""
                  FIRST=false
                  ;;
                *)
                  echo "::warning::Unknown variant '$V' skipped (valid: main, cuda, cuda126, ollama, slim)"
                  ;;
              esac
            done
            ARR+="]"
            echo "variants=$ARR" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve-variants
    runs-on: ubuntu-latest
    if: ${{ !inputs.prune_only }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        variant: ${{ fromJson(needs.resolve-variants.outputs.variants) }}
        include:
          - variant: main
            suffix: ""
            build_args: ""
            free_disk: false
          # To enable other variants, uncomment and pass e.g. variants="main,cuda":
          # - variant: cuda
          #   suffix: "-cuda"
          #   build_args: "USE_CUDA=true"
          #   free_disk: true
          # - variant: cuda126
          #   suffix: "-cuda126"
          #   build_args: |
          #     USE_CUDA=true
          #     USE_CUDA_VER=cu126
          #   free_disk: true
          # - variant: ollama
          #   suffix: "-ollama"
          #   build_args: "USE_OLLAMA=true"
          #   free_disk: false
          # - variant: slim
          #   suffix: "-slim"
          #   build_args: "USE_SLIM=true"
          #   free_disk: false

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_NAME=${IMAGE_REPOSITORY,,}" >> ${GITHUB_ENV}
          echo "FULL_IMAGE_NAME=${REGISTRY}/${IMAGE_REPOSITORY,,}" >> ${GITHUB_ENV}
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> ${GITHUB_ENV}

      - name: Free disk space
        if: matrix.free_disk
        run: rm -rf /opt/hostedtoolcache

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare CI Dockerfile
        run: |
          awk '
            /^FROM --platform=\$BUILDPLATFORM node:/ {
              print
              print "ENV NODE_OPTIONS=\"--max-old-space-size=12288\""
              next
            }
            { print }
          ' Dockerfile > "${RUNNER_TEMP}/Dockerfile"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Forks cannot push ghcr.io packages with GITHUB_TOKEN (fork repo
          # tokens are read-only for packages, regardless of workflow
          # permissions). Use the user-level GHCR_TOKEN secret instead.
          # (secrets.X evaluates to "" not undefined, so `||` never falls
          # through to GITHUB_TOKEN here - it would always pick GITHUB_TOKEN.)
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Read package version
        id: pkg-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for Docker images
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=${{ steps.tag-context.outputs.combined_suffix }}
            type=ref,event=tag,suffix=${{ steps.tag-context.outputs.combined_suffix }}
            type=sha,prefix=git-,suffix=${{ steps.tag-context.outputs.combined_suffix }}
            type=semver,pattern={{version}},suffix=${{ steps.tag-context.outputs.combined_suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ steps.tag-context.outputs.combined_suffix }}
            ${{ format('type=raw,enable={0},value={1}-subpath', github.ref == 'refs/heads/main', steps.pkg-version.outputs.version) }}
            ${{ format('type=raw,enable={0},value=latest{1}', github.ref == 'refs/heads/main', steps.tag-context.outputs.combined_suffix) }}
            ${{ matrix.suffix != '' && format('type=raw,enable={0},value={1}', github.ref == 'refs/heads/main', steps.tag-context.outputs.alias_tag) || '' }}
          flavor: |
            latest=false

      - name: Extract metadata for Docker cache
        id: cache-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            ${{ github.ref_type == 'tag' && 'type=raw,value=main' || '' }}
          flavor: |
            prefix=cache-${{ matrix.variant }}-${{ matrix.platform }}-
            latest=false

      - name: Validate WEBUI_SUBPATH
        env:
          WEBUI_SUBPATH_INPUT: ${{ inputs.webui_subpath }}
        run: |
          sub="$WEBUI_SUBPATH_INPUT"
          if [ -n "$sub" ]; then
            case "$sub" in
              /*) ;;
              *) echo "::error::WEBUI_SUBPATH must start with '/' (got '$sub'); leave empty to serve at root."; exit 1 ;;
            esac
            case "$sub" in
              */) echo "::error::WEBUI_SUBPATH must not end with a trailing '/' (got '$sub'); use e.g. /openwebui."; exit 1 ;;
            esac
          fi
          echo "WEBUI_SUBPATH validated as '${sub:-<root>}'"

      - name: Derive tag context
        id: tag-context
        env:
          WEBUI_SUBPATH_INPUT: ${{ inputs.webui_subpath }}
          VARIANT_NAME: ${{ matrix.variant }}
          VARIANT_SUFFIX: ${{ matrix.suffix }}
        run: |
          subpath_suffix=""
          alias_tag="$VARIANT_NAME"
          if [ -n "$WEBUI_SUBPATH_INPUT" ]; then
            subpath_suffix="-subpath"
            alias_tag="${VARIANT_NAME}${subpath_suffix}"
          fi

          combined_suffix="${VARIANT_SUFFIX}${subpath_suffix}"

          {
            echo "combined_suffix=${combined_suffix}"
            echo "alias_tag=${alias_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          file: ${{ runner.temp }}/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.FULL_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ steps.cache-meta.outputs.tags }}
          cache-to: type=registry,ref=${{ steps.cache-meta.outputs.tags }},mode=max
          sbom: true
          build-args: |
            BUILD_HASH=${{ github.sha }}
            BUILD_CHANNEL=${{ github.ref == 'refs/heads/dev' && 'dev' || (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'main' || 'unknown' }}
            WEBUI_SUBPATH=${{ inputs.webui_subpath }}
            ${{ matrix.build_args }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [resolve-variants, build]
    if: ${{ !cancelled() && !inputs.prune_only }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.resolve-variants.outputs.variants) }}
        include:
          - variant: main
            suffix: ""
          # Uncomment to match build job variants:
          # - variant: cuda
          #   suffix: "-cuda"
          # - variant: cuda126
          #   suffix: "-cuda126"
          # - variant: ollama
          #   suffix: "-ollama"
          # - variant: slim
          #   suffix: "-slim"

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_NAME=${IMAGE_REPOSITORY,,}" >> ${GITHUB_ENV}
          echo "FULL_IMAGE_NAME=${REGISTRY}/${IMAGE_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Download digests
        id: download
        uses: actions/download-artifact@v5
        with:
          pattern: digests-${{ matrix.variant }}-*
          path: /tmp/digests
          merge-multiple: true
        continue-on-error: true

      - name: Check digests
        id: check
        run: |
          count=$(find /tmp/digests -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "digest_count=$count" >> $GITHUB_OUTPUT
          if [ "$count" -lt 2 ]; then
            echo "::warning::${{ matrix.variant }}: found $count digest(s), need 2 (one per arch). Skipping merge."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Forks cannot push ghcr.io packages with GITHUB_TOKEN (fork repo
          # tokens are read-only for packages, regardless of workflow
          # permissions). Use the user-level GHCR_TOKEN secret instead.
          # (secrets.X evaluates to "" not undefined, so `||` never falls
          # through to GITHUB_TOKEN here - it would always pick GITHUB_TOKEN.)
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Derive tag context
        if: steps.check.outputs.skip != 'true'
        id: tag-context
        env:
          WEBUI_SUBPATH_INPUT: ${{ inputs.webui_subpath }}
          VARIANT_NAME: ${{ matrix.variant }}
          VARIANT_SUFFIX: ${{ matrix.suffix }}
        run: |
          subpath_suffix=""
          alias_tag="$VARIANT_NAME"
          if [ -n "$WEBUI_SUBPATH_INPUT" ]; then
            subpath_suffix="-subpath"
            alias_tag="${VARIANT_NAME}${subpath_suffix}"
          fi

          combined_suffix="${VARIANT_SUFFIX}${subpath_suffix}"

          {
            echo "combined_suffix=${combined_suffix}"
            echo "alias_tag=${alias_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata for Docker images
        if: steps.check.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=${{ steps.tag-context.outputs.combined_suffix }}
            type=ref,event=tag,suffix=${{ steps.tag-context.outputs.combined_suffix }}
            type=sha,prefix=git-,suffix=${{ steps.tag-context.outputs.combined_suffix }}
            type=semver,pattern={{version}},suffix=${{ steps.tag-context.outputs.combined_suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ steps.tag-context.outputs.combined_suffix }}
            ${{ format('type=raw,enable={0},value=latest{1}', github.ref == 'refs/heads/main', steps.tag-context.outputs.combined_suffix) }}
            ${{ matrix.suffix != '' && format('type=raw,enable={0},value={1}', github.ref == 'refs/heads/main', steps.tag-context.outputs.alias_tag) || '' }}
          flavor: |
            latest=false

      - name: Create manifest list and push
        if: steps.check.outputs.skip != 'true'
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.FULL_IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        if: steps.check.outputs.skip != 'true'
        run: |
          docker buildx imagetools inspect ${{ env.FULL_IMAGE_NAME }}:${{ steps.meta.outputs.version }}

# notify-helm-charts: removed for this fork — the helm-charts repo and
# its HELM_CHARTS_APP_ID / HELM_CHARTS_APP_PRIVATE_KEY secrets do not
# exist here; the job failed every tag dispatch with "appId option is
# required". Re-add from upstream if you adopt the helm-charts repo.


  prune:
    runs-on: ubuntu-latest
    needs: [merge]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      packages: write
    steps:
      # Deletes package versions whose tags belong to an older publish or
      # are buildx cache manifests, so the ghcr package (and the GitHub
      # packages UI) never accumulates stale entries. Keeps: this run's
      # tags (git-<sha7>[-variant][-subpath], <variant>, latest[-...],
      # main[-...], <sha7>) and pinned v* release tags (the
      # v0.11.4-subpath family).
      - name: Prune stale package versions
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_SHA: ${{ github.sha }}
          WEBUI_SUBPATH: ${{ inputs.webui_subpath }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${IMAGE_REPOSITORY##*/}"
          SHA7="${CURRENT_SHA:0:7}"
          SUFFIX=""
          [ -n "$WEBUI_SUBPATH" ] && SUFFIX="-subpath"
          python3 - "$OWNER" "$REPO" "$SHA7" "$SUFFIX" <<'PYEOF'
          import json, os, re, sys, time, urllib.request, urllib.error
          owner, repo, sha7, suffix = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          token = os.environ["GITHUB_TOKEN"]
          def api(path, method="GET"):
              req = urllib.request.Request(f"https://api.github.com{path}", method=method,
                  headers={"Authorization": f"Bearer {token}",
                           "Accept": "application/vnd.github+json"})
              try:
                  r = urllib.request.urlopen(req); b = r.read()
                  return r.status, (json.loads(b) if b else None)
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:200].decode()
          allv, page = [], 1
          while True:
              st, data = api(f"/users/{owner}/packages/container/{repo}/versions?per_page=100&page={page}")
              if not isinstance(data, list) or not data:
                  break
              allv.extend(data)
              if len(data) < 100:
                  break
              page += 1
          # tags created by this run (see build/merge jobs in this file)
          cur_git = re.compile(rf"^(git-{sha7}|{sha7})(-(main|cuda|cuda126|ollama|slim))?{re.escape(suffix)}$")
          cur_alias = re.compile(r"^(main|latest|cuda|cuda126|ollama|slim)(-(main|cuda|cuda126|ollama|slim))?" + re.escape(suffix) + "$")
          pinned = re.compile(r"^v\d+\.")
          def tags_of(v):
              return set((v.get("metadata", {}).get("container", {}) or {}).get("tags") or [])
          drop, kept = [], 0
          for v in allv:
              ts = tags_of(v)
              if not ts or any(cur_git.search(t) or cur_alias.search(t) or pinned.search(t) for t in ts):
                  kept += 1
                  continue
              drop.append(v["id"])
          print(f"versions: {len(allv)}, keeping {kept}, deleting {len(drop)}")
          for vid in drop:
              st, body = api(f"/users/{owner}/packages/container/{repo}/versions/{vid}", method="DELETE")
              if st not in (200, 202, 204, 404):
                  print(f"FAIL {vid}: {st} {body}")
                  raise SystemExit(1)
              time.sleep(0.3)
          print("prune complete")
          PYEOF
