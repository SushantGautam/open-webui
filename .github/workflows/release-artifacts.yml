name: Build & publish artifacts to GitHub Release

on:
  # Manual-only: builds the wheel + sdist and publishes them as a GitHub
  # Release (persistent assets). Never publishes to PyPI - trusted
  # publishing is registered to the upstream repository, so publishing
  # from this fork would always fail with invalid-publisher (see FORK.md).
  # Only the `-subpath` variant is published here (tag v<version>-subpath);
  # plain/root builds live in the official open-webui repo.
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: 3.11
      - name: Build
        env:
          # Baked into the wheel frontend at build time, same as the
          # Dockerfile (svelte/vite read process.env.WEBUI_SUBPATH).
          WEBUI_SUBPATH: /chat
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build .
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-subpath"
          # gh release create reuses an existing tag (or creates it on the
          # default branch); never moves one - matches the FORK.md tag policy
          # (e.g. the pinned v0.11.4 tag stays on pristine upstream).
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" \
              --title "Open WebUI ${TAG}" \
              --notes "Pre-built wheel + sdist for open-webui ${VERSION} (sushantgautam fork). Frontend built with WEBUI_SUBPATH=/chat (subpath is baked in at build time) - serve with WEBUI_SUBPATH=/chat at runtime too." \
              dist/*
          fi
