services:
  caddy:
    image: caddy:2-alpine
    container_name: open-webui-proxy
    ports:
      - "3000:80"
    volumes:
      - ./Caddyfile.langfuse:/etc/caddy/Caddyfile:ro
    depends_on:
      - open-webui
    restart: unless-stopped

  open-webui:
    image: ghcr.io/sushantgautam/open-webui:v0.12.0.1-subpath
    container_name: open-webui-langfuse
    volumes:
      - open-webui:/app/backend/data
    environment:
      - WEBUI_SECRET_KEY=langfuse-otel-dev-key

      # OTel traces → Langfuse Cloud
      - ENABLE_OTEL=true
      - ENABLE_OTEL_TRACES=true
      - OTEL_SERVICE_NAME=open-webui
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://cloud.langfuse.com/api/public/otel/v1/traces
      - OTEL_OTLP_SPAN_EXPORTER=http
      - OTEL_BASIC_AUTH_USERNAME=pk-lf-b7325467-e4eb-4735-82be-c7ab556165fa
      - OTEL_BASIC_AUTH_PASSWORD=sk-lf-9984199d-7260-4400-81e8-098aed8c29a5

      - ENABLE_OLLAMA_API=true
      - OLLAMA_BASE_URL=http://host.docker.internal:11434

    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  open-webui: {}
